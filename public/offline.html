<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hors ligne — Moyo</title>
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f7f3ea;color:#1f2937;font-family:system-ui,sans-serif;padding:24px;text-align:center}
img{width:200px;max-width:70%}
h1{font-size:1.4rem;margin:16px 0 8px}
p{max-width:34ch;margin:0 auto 20px;line-height:1.5}
button{background:#0f766e;color:#fff;border:0;border-radius:999px;padding:12px 24px;font-size:1rem;min-height:44px}
</style>
</head>
<body>
<main>
<img src="/images/illustrations/offline.svg" alt="Réseau indisponible">
<h1>Vous êtes hors ligne</h1>
<p>Moyo n'a pas pu se charger. Vos données de santé ne sont jamais conservées dans ce cache. Reconnectez-vous puis réessayez.</p>
<button onclick="location.reload()">Réessayer</button>
</main>
</body>
</html>
